services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: universe
      POSTGRES_USER: universe
      POSTGRES_PASSWORD: universe
    volumes:
      - universe-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universe"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=universe;Username=universe;Password=universe
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  universe-data:
